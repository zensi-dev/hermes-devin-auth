# Devin pack — installs BOTH halves of this repo in one command:
#   hermes plugins pack install https://raw.githubusercontent.com/zensi-dev/hermes-devin-auth/<ref>/hermes-pack.yaml
#
# Pack entries require exact 40-char commit SHAs (tags/branches rejected).
# `ref:` always points at the previous release commit — the pack can't
# reference the commit that contains it. Bump both refs after each release
# (`git rev-parse HEAD`), or regenerate with `hermes plugins pack export`.
name: devin-pack
description: Devin SWE models for Hermes Agent with native model integration and browser OAuth login.
author: zensi-dev
version: 1.0.0
plugins:
  - repo: zensi-dev/hermes-devin-auth
    ref: 71d0dcd4a4bbe39b3b38ce9c888c2c134ac0b1ef
    subdir: plugins/model-providers/devin
  - repo: zensi-dev/hermes-devin-auth
    ref: 71d0dcd4a4bbe39b3b38ce9c888c2c134ac0b1ef
    subdir: plugins/devin
